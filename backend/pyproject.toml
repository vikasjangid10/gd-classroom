[project]
name = "gd-classroom"
version = "1.0.0"
description = "AI moderated, voice-first Group Discussion platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "sse-starlette>=2.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
    "aiortc>=1.9",
    "av>=12.0",
    "numpy>=1.26",
    "email-validator>=2.2",
    "aiosmtplib>=3.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Local neural TTS. Kept out of the default install because onnxruntime is ~200 MB and
# nothing else in the project needs it — the image opts in, a test run does not.
voice = [
    "piper-tts>=1.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008",      # FastAPI Depends() in defaults is the documented idiom
    "UP042",     # `str, Enum` rather than StrEnum: keeps the project on Python 3.11
    "N811",      # PgUUID alias for postgresql.UUID is the SQLAlchemy convention
    "N818",      # SubscriberOverrun reads better than SubscriberOverrunError
    "ASYNC109",  # explicit timeouts on our own await helpers are deliberate
]

[tool.ruff.lint.per-file-ignores]
# Mirrors the stdlib audioop signature it stands in for.
"app/modules/voice/_audioop_shim.py" = ["N803"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["db: requires a live PostgreSQL instance"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
# Matches the runtime in the image. Pinning it to 3.11 made numpy's own stubs
# unparseable, which aborted the run before any of our code was checked.
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/", "alembic/"]

# The dependency rule from the design doc, enforced in CI.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.modules", "app.infrastructure", "app.api", "app.db", "sqlalchemy", "fastapi",
]

# A module may use another module's *service*. It may never reach past that service
# into the tables behind it. `allow_indirect_imports` is what draws that line: going
# through the owning service is exactly the permitted route.
[[tool.importlinter.contracts]]
name = "Modules never reach into another module's persistence"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "app.modules.classroom",
    "app.modules.invitation",
    "app.modules.session",
    "app.modules.moderation",
]
forbidden_modules = [
    "app.modules.identity.repository",
    "app.modules.classroom.repository",
    "app.modules.invitation.repository",
    "app.modules.session.repository",
]
ignore_imports = [
    "app.modules.classroom.** -> app.modules.classroom.repository",
    "app.modules.invitation.** -> app.modules.invitation.repository",
    "app.modules.session.** -> app.modules.session.repository",
]

# Dependencies point inward. The application layer composes modules; a module must
# never import the layer that wires it up.
[[tool.importlinter.contracts]]
name = "Modules do not depend on the application layer"
type = "forbidden"
source_modules = ["app.modules", "app.domain"]
forbidden_modules = ["app.application"]
